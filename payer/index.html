<!--
  payer/ — LA PAGE DE PAIEMENT DE L'APK ANDROID (2026-09-22)

  Ouverte par l'app ZIRA téléchargée sur tryzira.com, dans un onglet Chrome,
  quand la personne choisit un pack. Voir zira-v4-app/src/services/paiementSite.js.

    https://tryzira.com/payer/#pack=popular&appareil=<id>&langue=fr

  Tout passe dans le FRAGMENT (#) : il ne quitte jamais le téléphone, ni vers
  GitHub Pages, ni dans l'en-tête Referer vers Paddle.

  La page :
    1. demande au serveur le jeton PUBLIC Paddle et les prix
       (GET /billing/paddle/config — rien n'est gravé ici) ;
    2. relève le solde de l'appareil ;
    3. ouvre le paiement Paddle avec customData.device_id ;
    4. après paiement, relit le solde jusqu'à le voir monter — c'est le
       webhook SIGNÉ qui crédite, `checkout.completed` ne prouve rien ;
    5. rend la main à l'app : zira4://paiement?etat=ok (ou etat=annule).

  ⚠️ Le retour automatique vers l'app peut être refusé par Chrome sans geste
  de la personne. Le bouton « Revenir dans ZIRA » est donc toujours là.

  ⚠️ Tant que Render porte un jeton de SANDBOX, un bandeau « mode test »
  s'affiche avec l'identifiant de l'appareil : c'est lui qu'on inscrit dans
  PADDLE_APPAREILS_TEST pour que le paiement d'essai soit crédité. Aucun
  autre appareil ne l'est (voir _paddle_appareil_autorise dans zira-ai).
-->
<style>
  :root{
    --deep:#070524;
    --royal:#1447A5;
    --cyan:#00D4FF;
    --offwhite:#F0F4FF;
    --ink:rgba(240,244,255,.82);
    --ink-soft:rgba(240,244,255,.55);
    --line:rgba(240,244,255,.14);
    --display:'Cormorant Garamond',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;font-family:var(--body);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(20,71,165,.55), transparent 60%),
      linear-gradient(180deg, var(--deep), #050318 60%, #04020f);
    display:flex;align-items:center;justify-content:center;padding:32px 20px}
  main{width:100%;max-width:420px;text-align:center}
  .sigle{font-family:var(--display);font-size:22px;letter-spacing:.35em;color:var(--offwhite);
    margin-bottom:36px;padding-inline-start:.35em}
  h1{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.2;color:var(--offwhite);margin-bottom:14px}
  p{font-size:16px}
  .boutons{display:flex;flex-direction:column;gap:12px;margin-top:32px}
  .bouton{display:block;width:100%;padding:15px 20px;border-radius:14px;font:500 16px var(--body);
    text-decoration:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
  .bouton.fort{border-color:rgba(0,212,255,.55);background:rgba(20,71,165,.35);color:var(--offwhite)}
  .bouton[hidden]{display:none}
  .roue{width:34px;height:34px;margin:0 auto 26px;border-radius:50%;
    border:2px solid var(--line);border-top-color:var(--cyan);animation:tour 1s linear infinite}
  .roue[hidden]{display:none}
  @keyframes tour{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.roue{animation-duration:3s}}
  .test{margin-bottom:28px;padding:12px 14px;border-radius:12px;font-size:13px;
    border:1px dashed rgba(0,212,255,.5);color:var(--cyan)}
  .test[hidden]{display:none}
  .test code{display:block;margin-top:6px;font-size:12px;color:var(--ink-soft);word-break:break-all;direction:ltr}
  .legal{margin-top:44px;font-size:13px;color:var(--ink-soft)}
  .legal a{color:var(--ink-soft);text-underline-offset:3px}
</style>
</head>

  // ─── Le fragment : pack, appareil, langue ─────────────────────────────
  function lireFragment() {
    var sortie = {};
    (location.hash || '').replace(/^#/, '').split('&').forEach(function (morceau) {
      var i = morceau.indexOf('=');
      if (i <= 0) return;
      try {
        sortie[decodeURIComponent(morceau.slice(0, i))] = decodeURIComponent(morceau.slice(i + 1));
      } catch (e) { /* morceau illisible : ignoré */ }
    });
    return sortie;
  }

  function choisirLangue(demandee) {
    if (demandee && TEXTES[demandee]) return demandee;
    var nav = String(navigator.language || '').toLowerCase().split('-')[0];
    return TEXTES[nav] ? nav : 'en';
  }

  var params = lireFragment();
  var langue = choisirLangue(params.langue);
  var T = TEXTES[langue];
  document.documentElement.lang = LANG_HTML[langue];
  document.documentElement.dir = DROITE_A_GAUCHE[langue] ? 'rtl' : 'ltr';

  var el = {
    titre: document.getElementById('titre'),
    texte: document.getElementById('texte'),
    roue: document.getElementById('roue'),
    retour: document.getElementById('retour'),

  document.getElementById('lien-confidentialite').textContent = T.confidentialite;

  // ─── Les états de la page ─────────────────────────────────────────────
  // [titre, texte, roue, retour (null = caché), réessayer]

    chargement: ['un_instant', 'ouverture', true, null, false],
    lien:       ['lien_titre', 'lien_texte', false, 'annule', false],

  // Tout texte passe par textContent : rien de ce qui vient du fragment ou
  // du réseau n'est jamais interprété comme du HTML.
  function montrer(nom, n) {
    var e = ETATS[nom];
    etatCourant = nom;
    el.titre.textContent = T[e[0]];
    el.texte.textContent = T[e[1]].replace('{n}', String(n || ''));
    el.roue.hidden = !e[2];
    el.retour.hidden = e[3] === null;
    if (e[3]) el.retour.href = RETOUR + '?etat=' + e[3];
    el.reessayer.hidden = !e[4];
  }

  // ─── Réseau ───────────────────────────────────────────────────────────
  function lireJSON(url) {
    var controle = typeof AbortController === 'function' ? new AbortController() : null;
    var minuteur = setTimeout(function () { if (controle) controle.abort(); }, 10000);
    return fetch(url, { signal: controle ? controle.signal : undefined, cache: 'no-store' })
      .then(function (r) {
        clearTimeout(minuteur);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }, function (e) { clearTimeout(minuteur); throw e; });
  }

  function lireSolde(appareil) {
    return lireJSON(API + '/user/' + encodeURIComponent(appareil) + '/balance')
      .then(function (d) {
        var n = Number(d && d.tokens_balance);
        if (!isFinite(n)) throw new Error('solde illisible');
        return n;
      });
  }

  function chargerPaddle() {
    return new Promise(function (resolve, reject) {
      if (window.Paddle) { resolve(window.Paddle); return; }
      var s = document.createElement('script');
      s.src = PADDLE_JS;
      s.async = true;
      // Un bloqueur, un bouclier Brave ou un réseau coupé : les trois causes
      // vues en pratique. Chargé mais absent = script vide servi par un bloqueur.
      s.onload = function () { window.Paddle ? resolve(window.Paddle) : reject(new Error('vide')); };
      s.onerror = function () { reject(new Error('bloqué')); };
      document.head.appendChild(s);
    });
  }

  // ─── Le paiement ──────────────────────────────────────────────────────
  var session = { priceId: null, appareil: null, avant: null, paye: false, pret: false };

  function ouvrir() {
    session.paye = false;
    montrer('paiement');
    try {
      window.Paddle.Checkout.open({
        items: [{ priceId: session.priceId, quantity: 1 }],
        // LE lien entre le paiement et l'appareil. Sans lui, le webhook reçoit
        // un paiement qu'il ne sait attribuer à personne.
        customData: { device_id: session.appareil },
        settings: { displayMode: 'overlay', theme: 'dark', locale: LOCALE_PADDLE[langue] }
      });
    } catch (e) {
      montrer('erreur');
    }
  }

  function surEvenement(ev) {
    if (!ev || !ev.name) return;
    if (ev.name === 'checkout.completed') {
      if (session.paye) return;
      session.paye = true;
      montrer('attente');
      // On laisse voir la confirmation de Paddle, puis on rend la page.
      setTimeout(function () {
        try { window.Paddle.Checkout.close(); } catch (e) { /* déjà fermée */ }
      }, 2500);
      attendreCredit();
    } else if (ev.name === 'checkout.closed') {
      // Après un paiement, `closed` suit `completed` : rien à dire de plus.
      if (!session.paye) montrer('annule');
    } else if (ev.name === 'checkout.error') {
      if (!session.paye) montrer('erreur');
    }
  }

  // La preuve, c'est le solde qui monte : `checkout.completed` vient du
  // navigateur et n'importe qui peut l'émettre.
  function attendreCredit() {
    if (session.avant === null) { montrer('lent'); return; }
    var fin = Date.now() + ATTENTE_CREDIT_MS;
    (function tour() {
      lireSolde(session.appareil).then(function (solde) {
        if (solde > session.avant) {
          montrer('credite', solde - session.avant);
          // Tentative de retour automatique ; Chrome peut la refuser sans
          // geste de la personne, le bouton reste là pour ça.
          setTimeout(function () { location.href = RETOUR + '?etat=ok'; }, 1500);
          return;
        }
        if (Date.now() > fin) { montrer('lent'); return; }
        setTimeout(tour, PAS_MS);
      }, function () {
        if (Date.now() > fin) { montrer('lent'); return; }
        setTimeout(tour, PAS_MS);
      });
    })();
  }

  el.reessayer.addEventListener('click', function () {
    // Paddle.js n'a pas chargé : il faut recharger la page pour réessayer.
    if (!session.pret) { location.reload(); return; }
    ouvrir();
  });

  function demarrer() {
    montrer('chargement');

    var pack = params.pack;
    var appareil = params.appareil;
    if (!pack || !/^[A-Za-z0-9._-]{8,128}$/.test(appareil || '')) {
      montrer('lien');
      return;
    }

    lireJSON(API + '/billing/paddle/config').then(function (config) {
      // Le pack vient du fragment, donc de n'importe qui : on ne lit que les
      // clés PROPRES de la table (« __proto__ » n'est pas un pack).
      var prix = config && config.prix;
      var priceId = prix && Object.prototype.hasOwnProperty.call(prix, pack) ? prix[pack] : null;
      if (typeof priceId !== 'string' || !config.jeton) { montrer('ferme'); return; }
      session.priceId = priceId;
      session.appareil = appareil;

      if (config.environnement === 'sandbox') {
        document.getElementById('test-texte').textContent = T.test;
        document.getElementById('test-appareil').textContent = appareil;
        el.test.hidden = false;
      }

      return chargerPaddle().then(function (Paddle) {
        return lireSolde(appareil).then(function (s) { session.avant = s; },
                                        function () { session.avant = null; })
          .then(function () {
            // ⚠️ L'environnement AVANT l'initialisation : un jeton de sandbox
            // initialisé en production ouvre une fenêtre qui n'encaisse rien.
            if (config.environnement === 'sandbox') Paddle.Environment.set('sandbox');
            Paddle.Initialize({ token: config.jeton, eventCallback: surEvenement });
            session.pret = true;
            ouvrir();
          });
      }, function () {
        montrer('bloque');
      });
    }, function () {
      montrer('ferme');
    });
  }

  demarrer();
})();
</script>
</body>
</html>
